# hello.eval.yaml — a complete example that runs with NO API key and NO network.
#
# The model's turns are scripted (`provider: fake`), so the whole trajectory is
# deterministic. This is the suite that makes `dryfire run` go green within
# seconds of `init`. Read it top to bottom: it doubles as a tour of the format.
name: hello_weather

# `fake` replays the `script` below instead of calling a real model. Swap it for
# `provider: anthropic` (as in refund_agent.eval.yaml) to test a real agent.
provider: fake

# The tools the agent may call. dryfire never runs real tools — their results
# come from `mocks` below, which is what makes a run reproducible.
tools:
  - name: get_weather
    description: Look up the current weather for a city.
    input_schema:
      type: object
      properties:
        city: {type: string}
      required: [city]

# Deterministic fake tool results, matched top-to-bottom: the first rule whose
# `when` matches the call arguments wins; a rule with no `when` is the catch-all.
mocks:
  get_weather:
    - when: {city: "San Francisco"}
      return: {temp_f: 65, conditions: sunny}
    - return: {error: "unknown city"}

# One or more scenarios. Each is an independent conversation.
cases:
  - name: reports_the_weather
    # The user's opening message.
    input: "What's the weather in San Francisco?"
    # `script` is the model's side of the conversation, one entry per turn. Only
    # `provider: fake` cases use it; with a real provider you delete `script` and
    # let the model decide what to call.
    script:
      - tool_call: {name: get_weather, arguments: {city: "San Francisco"}}
      - text: "It's currently 65F and sunny in San Francisco."
    # Assertions run against the TRAJECTORY — the ordered tool calls — not just
    # the final text. That is the whole point of dryfire.
    expect:
      - calls_tool: get_weather
      - tool_args:
          tool: get_weather
          match: {city: "San Francisco"}
      - final_contains: "sunny"
