# Keeps GitHub Actions current — including the SHA-pinned third-party actions
# (dorny/test-reporter in action.yml, pypa/gh-action-pypi-publish in release.yml):
# Dependabot bumps both the pinned SHA and its trailing "# vX.Y.Z" comment, so the
# pins stay immutable *and* maintained. All action updates are grouped into one
# weekly PR to keep the noise down.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/" # covers .github/workflows/* and the root composite action.yml
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    groups:
      github-actions:
        patterns: ["*"]
    open-pull-requests-limit: 5
    ignore:
      # dorny/test-reporter is a third-party action in the distributed action.yml
      # (it runs in users' repos and isn't exercised by our CI). A major bump can
      # change its inputs/behaviour, so bump it deliberately — with a changelog read
      # and a throwaway-repo re-verify — not automatically. Patch/minor bumps (incl.
      # SHA refreshes within v1) are still proposed.
      - dependency-name: "dorny/test-reporter"
        update-types: ["version-update:semver-major"]
