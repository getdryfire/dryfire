# Keeps GitHub Actions current — including the SHA-pinned third-party actions
# (dorny/test-reporter in action.yml, pypa/gh-action-pypi-publish in release.yml):
# Dependabot bumps both the pinned SHA and its trailing "# vX.Y.Z" comment, so the
# pins stay immutable *and* maintained. All action updates are grouped into one
# weekly PR to keep the noise down.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/" # covers .github/workflows/* and the root composite action.yml
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    groups:
      github-actions:
        patterns: ["*"]
    open-pull-requests-limit: 5
    ignore:
      # Ignore MAJOR action bumps. When we're already on a supported runtime they add
      # churn with no benefit, and a genuine major (e.g. a runtime deprecation, or a
      # third-party action like dorny/test-reporter that runs in users' repos) warrants a
      # deliberate manual bump + re-verify anyway — not an auto-merge. Patch/minor updates
      # and SHA refreshes (which keep the pinned dorny/pypa actions fresh) still come through.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
