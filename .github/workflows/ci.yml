name: CI

# No secrets are configured in this workflow — the entire suite must pass
# offline with no API key (EPIC-001 success criterion 2).
on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Sync dependencies
        run: uv sync --all-extras
      - name: Lint
        run: uv run ruff check .
      - name: Type-check
        run: uv run mypy
      - name: Architecture contracts
        run: uv run lint-imports
      - name: Tests (offline, no API key)
        run: uv run pytest

  # A separate job so a dogfood regression is distinguishable at a glance from a
  # unit-test failure (AC-018). dryfire runs its own eval suite against the
  # fake provider — offline, no API key.
  dogfood:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - name: Sync dependencies
        run: uv sync --all-extras
      - name: Dogfood (dryfire runs its own eval suite)
        run: ./scripts/run_dogfood.sh
