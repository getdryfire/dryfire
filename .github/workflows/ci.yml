name: CI

# No secrets are configured in this workflow — the entire suite must pass
# offline with no API key (EPIC-001 success criterion 2).
on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Sync dependencies
        run: uv sync --all-extras
      - name: Lint
        run: uv run ruff check .
      - name: Type-check
        run: uv run mypy
      - name: Architecture contracts
        run: uv run lint-imports
      - name: Tests (offline, no API key)
        run: uv run pytest
