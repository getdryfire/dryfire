name: CodeQL

# Static security analysis (SAST) for the Python source. Free for public repos.
# Findings surface in Security → Code scanning and as inline PR annotations.
# This complements — does not replace — ruff/mypy/import-linter in ci.yml.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly full scan (Mondays 03:31 UTC) to catch newly-published query patterns.
    - cron: "31 3 * * 1"

jobs:
  analyze:
    name: Analyze (python)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python
          # dryfire is pure Python — no compiled build step to observe.
          build-mode: none

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:python"
