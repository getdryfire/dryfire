# No postgres, no redis, no long-running services — dryfire is a zero-infra
# CLI (SPEC §1.4). Compose provides one-shot toolchain containers:
#   make docker-check       full gate on Python 3.12
#   make docker-check-313   full gate on Python 3.13 (local CI matrix)
#   make docker-shell       interactive shell
services:
  dev:
    build:
      context: .
      args:
        PYTHON_VERSION: "3.12"
    image: dryfire-dev:py312
    volumes:
      - .:/app
      # Mask the host's .venv (macOS binaries); the container venv is /opt/venv.
      - /app/.venv
    environment:
      - ANTHROPIC_API_KEY

  dev-313:
    profiles: ["matrix"]
    build:
      context: .
      args:
        PYTHON_VERSION: "3.13"
    image: dryfire-dev:py313
    volumes:
      - .:/app
      - /app/.venv
    environment:
      - ANTHROPIC_API_KEY
